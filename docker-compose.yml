# Defines isolated virtual routing zones to segment container communications.
networks:
  frontend-api:
    driver: bridge
  api-db:
    driver: bridge

services:
  # Installs the specified image in the current directory when called.
  installer:
    image: node:24-slim
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: sh
    command: -c "npm install"

  # Encapsulates the back-end relational data storage engine.
  postgres-db:
    image: postgres:18-alpine
    container_name: secure_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Mounts local provisioning schema definitions directly to the container lifecycle path.
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - api-db

  # Encapsulates the primary application routing and transaction logic.
  backend-api:
    build: ./backend
    container_name: secure_backend
    restart: always
    environment:
      DB_HOST: postgres-db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
    networks:
      - frontend-api
      - api-db
    depends_on:
      - postgres-db

  # Encapsulates the front-end user presentation interface served via Nginx.
  frontend-ui:
    build: ./frontend
    container_name: secure_frontend
    restart: always
    ports:
      - "3000:80"
    networks:
      - frontend-api