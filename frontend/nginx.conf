server {
    listen 80;
    server_name localhost;

    # Root directory context for static web asset serving
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Forwards health checks
    location /health {
            proxy_pass http://backend-api:5000/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    # Catches and proxies data transactions
    location /api/ {
        # Points directly to the service container name designated in docker-compose.yml
        proxy_pass http://backend-api:5000;

        # Injects connection headers to preserve original client contexts
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}