# Implements separated memory maps by logical domain to prevent
# cross-feature denial of service (DoS)
limit_req_zone $binary_remote_addr zone=login_throttle:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=registration_throttle:10m rate=2r/s;

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Catches requests to port 80 to upgrade to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name localhost;
    server_tokens off;

    limit_req_status 429;

    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    # Injects security guardrails directly onto static assets
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
;     add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
;     add_header X-Frame-Options "SAMEORIGIN" always;
;     add_header X-Content-Type-Options "nosniff" always;

    # Explicitly handles static file extensions to prevent the SPA fallback from masking 404s
    location ~* \.(txt|xml|svg|css|js)$ {
        root /usr/share/nginx/html;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
;         add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
;         add_header X-Frame-Options "SAMEORIGIN" always;
;         add_header X-Content-Type-Options "nosniff" always;

        try_files $uri =404;
    }

    # Root directory context for static web asset serving
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Throttled login path
    location /api/login {
        limit_req zone=login_throttle burst=5 nodelay;

        proxy_pass http://secure_backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Throttled registration path
    location /api/register {
        limit_req zone=registration_throttle burst=2 nodelay;

        proxy_pass http://secure_backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Forwards health checks
    location /health {
        proxy_pass http://secure_backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Catches and proxies data transactions
    location /api/ {
        proxy_pass http://secure_backend:5000;

        # Injects connection headers to preserve original client contexts
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}