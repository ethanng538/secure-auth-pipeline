name: "Automated SAST guardrails"

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  sast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Ingest source code
        uses: actions/checkout@v4

      - name: Execute local rule matrix
        # Runs the official Semgrep container engine directly via the open CLI
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep semgrep scan --config=/src/.github/security-rules/sast-rules.yml --error