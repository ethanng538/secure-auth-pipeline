rules:
  - id: appsec-critical-sqli
    languages: [javascript]
    severity: ERROR
    message: |
      🚨 APPSEC DETECTOR: Improper Neutralization of Special Elements used in an SQL Command (CWE-89)
      
      The codebase constructs a database command by combining raw text string blocks 
      directly with dynamic variables via '+' operators. An attacker can manipulate 
      these inputs to achieve total authentication bypass or data exfiltration.
      
      Remediation: Convert this routing logic to use parameterized queries ($1, $2).
    patterns:
      - pattern-either:
          - pattern: $POOL.query(... + $INPUT + ...)
          - pattern: |
              const $QUERY = ... + $INPUT + ...;
              ...
              $POOL.query($QUERY);

  - id: appsec-plaintext-password-storage
    languages: [javascript]
    severity: ERROR
    message: |
      🚨 APPSEC DETECTOR: Plaintext Storage of a Password (CWE-256)
      
      The application layer is sending unhashed credential variables directly into 
      relational storage tables. If our database server is ever compromised, every 
      user password buffer will be exposed instantly in plaintext format.
      
      Remediation: Pass incoming credential blocks through an irreversible hashing 
      module before executing database storage actions.
    patterns:
      - pattern: $POOL.query($QUERY, ...)
      - metavariable-regex:
          metavariable: $QUERY
          regex: '(?i).*(password|pass).*'