rules:
  - id: appsec-critical-sqli
    languages: [javascript]
    severity: ERROR
    message: |
      🚨 APPSEC DETECTOR: Improper Neutralization of Special Elements used in an SQL Command (CWE-89)

      Plain English Advisory:
      The codebase constructs a database query by combining raw text string blocks
      directly with dynamic variables via concatenation. An attacker can manipulate
      these inputs to achieve data exfiltration or modification.

      Remediation: convert this routing logic to use parameterised queries ($1, $2).
    patterns:
      - pattern-either:
          - pattern: $POOL.query(... + $INPUT + ...)
          - pattern: |
              const $QUERY = ... + $INPUT + ...;
              ...
              $POOL.query($QUERY);

  - id: appsec-high-unhashed-credential-storage
    languages: [javascript]
    severity: ERROR
    message: |
      🚨 APPSEC DETECTOR: Insecure Dataflow - Unsanitised Storage (CWE-256)
      
      The system detected a database transaction interacting with identity registries
      where user parameters are routed directly to persistent data components without
      passing through an approved cryptographic sanitisation transformation.
      
      Remediation: pass incoming credential blocks through an irreversible hashing 
      module before executing database storage actions.
    patterns:
      - pattern-either:
        - pattern: |
            const $QUERY = $SQL_STRING;
            ...
            $POOL.query($QUERY);
        - pattern: |
            const $QUERY = $SQL_STRING;
            ...
            $POOL.query($QUERY, ...)
        - pattern: $POOL.query($SQL_STRING)
        - pattern: $POOL.query($SQL_STRING, ...)

      - metavariable-regex:
          metavariable: $SQL_STRING
          # Broad case-insensitive behavioural check looking for queries touching critical tables
          regex: '(?i).*(users|accounts|credentials|login|register).*'

    pattern-not-either:
      # Structure A: catches modular library object methods (e.g., bcrypt.hash)
      - pattern: |
          const $HASH = await $CRYPTO.$METHOD($SECRET, ...);
          ...
          const $VALUES = [..., $HASH, ...];
          ...
          $POOL.query($QUERY, $VALUES);

      # Structure B: catches standalone global function wraps (e.g., hash())
      - pattern: |
          const $HASH = await $METHOD($SECRET, ...);
          ...
          const $VALUES = [..., $HASH, ...];
          ...
          $POOL.query($QUERY, $VALUES);

      # Structure C: catches parameterised SELECT lookups that don't involve a password parameter
      - pattern: |
          const $QUERY = '...';
          ...
          $POOL.query($QUERY, [ $VAL ]);